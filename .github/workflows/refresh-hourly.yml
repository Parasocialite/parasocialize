name: counter

# The counter sweeps hourly. Machines find, read, judge and draft; nothing
# reaches the public shelf without a human signing it at /desk/.
#
# COST. This is the only thing on the site that costs money to run. Four repo
# variables control it, so you never have to edit code:
#   Settings > Secrets and variables > Actions > Variables
#     PARASOCIALIZE_PROVIDER      anthropic | openai | compatible  (default anthropic)
#     PARASOCIALIZE_BUDGET        drafts per hour               (default 12)
#     PARASOCIALIZE_MAX_CALLS     total model calls/hour        (default 30)
#     PARASOCIALIZE_RECENCY_DAYS  ignore anything older than     (default 6)
# Set PARASOCIALIZE_BUDGET=0 while you are away. The queue keeps filling and
# nothing reaches anybody until you are back. Better a backlog than a shelf
# you did not read.
#
# One secret: PARASOCIALIZE_KEY. Without it the sweeper still runs and files
# candidates raw and unfiled, flagged "no lens" on the desk. Nothing is lost.
#
# The optional Cloudflare step publishes the rebuilt site when this run commits
# a change. It does not put unsigned sweep items on the story shelf; those stay
# on /desk/ as the queue.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Drafts this run (0 = sweep only)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # Shared with the daily build: both commit and push the same repository, so
  # they must serialise rather than race. A 15-minute sweep overlapping a
  # 2-minute daily build used to lose the second push silently.
  group: repo-write
  cancel-in-progress: false   # never let two writers race the same commit

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'parasocialize' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the one dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Last sweep
        run: cat data/sweep.json 2>/dev/null || echo "(no previous sweep recorded)"

      - name: Sweep
        env:
          PARASOCIALIZE_KEY: ${{ secrets.PARASOCIALIZE_KEY }}
          PARASOCIALIZE_PROVIDER: ${{ vars.PARASOCIALIZE_PROVIDER || 'anthropic' }}
          PARASOCIALIZE_MODEL: ${{ vars.PARASOCIALIZE_MODEL }}
          PARASOCIALIZE_BASE: ${{ vars.PARASOCIALIZE_BASE }}
          PARASOCIALIZE_BUDGET: ${{ inputs.budget || vars.PARASOCIALIZE_BUDGET || '12' }}
          PARASOCIALIZE_MAX_CALLS: ${{ vars.PARASOCIALIZE_MAX_CALLS || '30' }}
          PARASOCIALIZE_RECENCY_DAYS: ${{ vars.PARASOCIALIZE_RECENCY_DAYS || '6' }}
        run: python tools/counter.py || echo "::warning::sweep failed, keeping the previous ledger"

      - name: Redraw the counter
        run: |
          # The 00:17 daily build is the intended writer of the new day's
          # edition, but a scheduled run can be delayed or dropped. The first
          # counter after midnight used to fail here, because build_cards.py
          # refuses to show a former top 8. If the edition is missing, make it
          # first; editor.py is idempotent for a date and the daily run will
          # keep it. Then build.
          if python -c "import datetime,json,sys,pathlib; f=json.loads(pathlib.Path('data/features.json').read_text(encoding='utf-8')); t=datetime.datetime.now(datetime.timezone.utc).date().isoformat(); sys.exit(0 if any(l.get('released')==t for l in f.get('lists',[])) else 1)"; then
            echo "today's edition exists"
          else
            echo "::warning::no top-8 edition dated today; generating it before the build"
            python tools/editor.py
          fi
          python tools/build_cards.py
          python tools/build_deploy.py --no-build

      - name: Check internal links
        run: python tools/link_audit.py

      - name: The daily record must be continuous
        run: python tools/archive.py --check

      - name: Commit
        id: commit
        run: |
          git config user.name "counter"
          git config user.email "counter@parasocialize.com"
          # Stage the whole tree, not a hand-listed subset. The subset left the
          # pages build_cards.py had just rewritten unstaged, so the rebase
          # refused with "You have unstaged changes" and the job died before
          # pushing anything. It also named `aisle`, a directory that no longer
          # exists, and the `|| true` hid that pathspec error.
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "sweep $(date -u +%FT%TZ)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          # Rebase and fail the step on a push failure. `|| echo ::error::`
          # exits 0, so the last shape could show a green job over a repository
          # that never received the sweep.
          git pull --rebase origin main
          git push

      - name: Publish to Cloudflare Pages (optional)
        if: steps.commit.outputs.changed == 'true' && env.CF_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PROJECT }} --branch=main
