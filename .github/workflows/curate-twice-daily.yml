name: daily

# The one scheduled job that leaves the repository current: rebuild the
# date-seeded pages, reconcile the daily record, run the non-browser gates,
# package dist/ and publish it as a workflow artifact.
#
# IT DOES NOT DEPLOY BY DEFAULT. Production is still a manual upload of dist/
# to Cloudflare Pages. If CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are
# set as repository secrets, the optional last step publishes dist/ directly;
# without them it skips and the artifact is still there for a manual upload.
# The project name comes from the CLOUDFLARE_PAGES_PROJECT variable, default
# "parasocialize". The token needs Pages:Edit on that account.
#
# THIS FILE WAS DECORATION UNTIL 2026-10-31. `origin` pointed at
# `YOUR-USER/parasocialize`, so no scheduled workflow had ever executed; the
# three daily records stopped at 21 October and the sweeper at 29 September
# while every check in the repo was green. A cron on a repository nobody
# pushed to is not automation. Set a real origin (or run tools/daily.py from a
# local scheduler) or this job is still a comment.
#
# GATES FAIL LOUDLY. Every step is run through tools/daily.py, which aborts on
# the first non-zero exit. Nothing is swallowed with `|| true`; the previous
# version of this job passed link_audit that way. The Chrome layout gates
# (verify_narrow, probe_nav, probe_hub_contrast) are deliberately not run here:
# they need a local browser and they measure design, not data.

on:
  schedule:
    # 00:17 UTC writes the new day's record as soon as the UTC date turns.
    # 12:17 is a no-op on the records by design and exists so a morning build
    # failure is retried inside the same day. Two separate expressions rather
    # than "0,12": the 1 November 00:17 slot produced no scheduled run, and
    # splitting the entry removes the comma-list as a suspect.
    - cron: "17 0 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with the hourly counter, because both jobs commit and push the same
  # repository. Separate groups (the previous shape) let a 15-minute sweep and a
  # 2-minute daily build overlap, and the second push lost the race while the
  # job still reported success - the `|| echo` swallowed it.
  group: repo-write
  cancel-in-progress: false   # never let two writers race the same commit

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'parasocialize' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the one dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: What the loop thinks the day is
        run: |
          python -c "import datetime; print('utc', datetime.datetime.now(datetime.timezone.utc).isoformat())"
          python tools/archive.py --check || true   # before the build today is legitimately missing

      - name: Daily build, record, gates and package
        run: >
          python tools/daily.py
          --zip "$RUNNER_TEMP/parasocialize-SITE.zip"

      - name: Keep the deploy tree for upload
        uses: actions/upload-artifact@v4
        with:
          name: parasocialize-dist
          path: |
            dist/
            ${{ runner.temp }}/parasocialize-SITE.zip
          retention-days: 14

      - name: Commit the rebuilt pages and the day's record
        run: |
          git config user.name "daily"
          git config user.email "daily@parasocialize.com"
          git add -A
          git diff --cached --quiet || git commit -m "daily $(date -u +%FT%TZ)"
          # Rebase onto a push that landed while this job was building, then
          # fail the step if the push fails. The previous `git push || echo
          # ::error::` exited 0, so GitHub showed a green job over a repository
          # that had not received the rebuilt pages.
          git pull --rebase origin main
          git push

      - name: Publish to Cloudflare Pages (optional)
        if: env.CF_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PROJECT }} --branch=main
