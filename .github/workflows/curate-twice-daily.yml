name: daily

# The one scheduled job that leaves the repository current: rebuild the
# date-seeded pages, reconcile the daily record, run the non-browser gates,
# package dist/ and publish it as a workflow artifact.
#
# IT DOES NOT DEPLOY. Production is still a manual upload of dist/ to Cloudflare
# Pages. What this job changes is that the artifact is guaranteed to be today's
# tree and to have passed the gates, instead of a folder somebody packaged from
# whatever day they last opened the repository.
#
# THIS FILE WAS DECORATION UNTIL 2026-10-31. `origin` points at
# `YOUR-USER/parasocialize`, so no scheduled workflow had ever executed; the
# three daily records stopped at 21 October and the sweeper at 29 September
# while every check in the repo was green. A cron on a repository nobody
# pushed to is not automation. Set a real origin (or run tools/daily.py from a
# local scheduler) or this job is still a comment.
#
# GATES FAIL LOUDLY. Every step is run through tools/daily.py, which aborts on
# the first non-zero exit. Nothing is swallowed with `|| true`; the previous
# version of this job passed link_audit that way. The Chrome layout gates
# (verify_narrow, probe_nav, probe_hub_contrast) are deliberately not run here:
# they need a local browser and they measure design, not data.

on:
  schedule:
    # 00:17 UTC writes the new day's record as soon as the UTC date turns.
    # 12:17 is a no-op on the records by design and exists so a morning build
    # failure is retried inside the same day.
    - cron: "17 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false   # never let two rebuilds race the same commit

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: What the loop thinks the day is
        run: |
          python -c "import datetime; print('utc', datetime.datetime.now(datetime.timezone.utc).isoformat())"
          python tools/archive.py --check || true   # before the build today is legitimately missing

      - name: Daily build, record, gates and package
        run: >
          python tools/daily.py
          --zip "$RUNNER_TEMP/parasocialize-SITE.zip"

      - name: Keep the deploy tree for upload
        uses: actions/upload-artifact@v4
        with:
          name: parasocialize-dist
          path: |
            dist/
            ${{ runner.temp }}/parasocialize-SITE.zip
          retention-days: 14

      - name: Commit the rebuilt pages and the day's record
        run: |
          git config user.name "daily"
          git config user.email "daily@parasocialize.com"
          git add -A
          git diff --cached --quiet || git commit -m "daily $(date -u +%FT%TZ)"
          # A failed push must be loud. A push failure once left the counter
          # three weeks stale while every job reported success.
          git push || echo "::error::could not push - the rebuilt pages are not in the repository"
