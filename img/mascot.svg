<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" width="240" height="120" role="img" aria-label="Parasocialize: an eight on its side, which is also two eyes">
  <title>Parasocialize</title>
  <defs>
    <linearGradient id="pz-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a1f"/>
      <stop offset="0.5" stop-color="#ff2d6f"/>
      <stop offset="1" stop-color="#a04dff"/>
    </linearGradient>
  </defs>

  <!-- the 8, lying on its side. two tangent loops = infinity = two eyes. -->
  <g fill="none" stroke="url(#pz-a)" stroke-width="11" stroke-linecap="round">
    <path d="M78 60a30 30 0 1 0 0-60 30 30 0 1 0 0 60"/>
    <path d="M162 60a30 30 0 1 0 0-60 30 30 0 1 0 0 60"/>
  </g>

  <!-- pupils, looking slightly off-axis. asymmetry is what makes it read as alive. -->
  <circle cx="84" cy="54" r="10" fill="#130d0a"/>
  <circle cx="156" cy="66" r="10" fill="#130d0a"/>
  <circle cx="87" cy="50" r="3.4" fill="#fff6ea"/>
  <circle cx="159" cy="62" r="3.4" fill="#fff6ea"/>
</svg>
