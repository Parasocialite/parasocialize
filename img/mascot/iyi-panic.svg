 clip-path="url(#iyigpaniccr)"><path d="M59.6 17.6A24.4 24.4 0 0 1 108.4 17.6L108.4 22.6A24.4 24.4 0 0 0 59.6 22.6Z" fill="#231009"/></g></g><g class="iyi-lid"><g clip-path="url(#iyigpaniccr)"><path d="M72.0 40q12.0 9 24 0" stroke="#231009" stroke-width="5.5" stroke-linecap="round" fill="none"/></g></g><circle class="iyi-iris" cx="40" cy="38" r="12.20" fill="url(#iyigpanici)" stroke="#231009" stroke-width="1.1"/><g class="iyi-gaze"><g class="iyi-pupil"><circle cx="40" cy="38" r="9.0" fill="#231009"/><circle cx="37.3" cy="34.94" r="2.61" fill="#ffffff"/><path d="M42.43 38.18L43.213 40.007L45.04 40.79L43.213 41.573L42.43 43.4L41.647 41.573L39.82 40.79L41.647 40.007Z" fill="#ffffff" opacity="0.92"/><circle cx="38.74" cy="42.5" r="0.8099999999999999" fill="#ffffff" opacity="0.5"/></g></g><circle class="iyi-iris" cx="86" cy="37" r="10.70" fill="url(#iyigpanici)" stroke="#231009" stroke-width="1.1"/><g class="iyi-gaze"><g class="iyi-pupil"><circle cx="86" cy="37" r="7.5" fill="#231009"/><circle cx="83.75" cy="34.45" r="0.87" fill="#ffffff"/><path d="M88.025 38.455000000000005L88.286 39.064L88.89500000000001 39.325L88.286 39.586000000000006L88.025 40.195L87.76400000000001 39.586000000000006L87.155 39.325L87.76400000000001 39.064Z" fill="#ffffff" opacity="0.368"/><circle cx="84.95" cy="40.75" r="0.26999999999999996" fill="#ffffff" opacity="0.2"/></g></g></g></svg>