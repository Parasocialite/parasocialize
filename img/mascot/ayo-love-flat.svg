<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 118" width="118" height="118" role="img" aria-label="Ayo"><title>Ayo - love</title><style>.ayo,.ayo-bloom,.ayo-lobe,.ayo-pupil,.ayo-lid,.ayo-blush{
transform-box:fill-box;transform-origin:center}
@keyframes ayo-breathe{0%,100%{transform:scale(1)}
50%{transform:scale(1.035)}}
@keyframes ayo-blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}}
@keyframes ayo-bloom-pulse{0%,100%{opacity:.26}50%{opacity:.42}}
.ayo{animation:ayo-breathe 5.4s ease-in-out infinite;animation-delay:var(--d,0s)}
.ayo-pupil{animation:ayo-blink 6.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.ayo-bloom{animation:ayo-bloom-pulse 5.4s ease-in-out infinite;animation-delay:var(--d,0s)}
@media (prefers-reduced-motion:reduce){
.ayo,.ayo-pupil,.ayo-bloom{animation:none}}</style><defs><clipPath id="ayoglovefcl"><circle cx="42" cy="42" r="26"/></clipPath><clipPath id="ayoglovefcr"><circle cx="76" cy="42" r="26"/></clipPath><mask id="ayoglovefm"><rect width="118" height="118" fill="#000"/><circle cx="42" cy="42" r="26" fill="#fff"/><circle cx="76" cy="42" r="26" fill="#fff"/><path d="M42 53.0C29.6 44.4 29.6 31.6 36.4 31.6C40.0 31.6 42 35.2 42 38.0C42 35.2 44.0 31.6 47.6 31.6C54.4 31.6 54.4 44.4 42 53.0Z" fill="#000"/><path d="M76 53.0C63.6 44.4 63.6 31.6 70.4 31.6C74.0 31.6 76 35.2 76 38.0C76 35.2 78.0 31.6 81.6 31.6C88.4 31.6 88.4 44.4 76 53.0Z" fill="#000"/></mask></defs><g class="ayo"><g class="ayo-lobe" mask="url(#ayoglovefm)"><circle cx="42" cy="42" r="26" fill="#231009"/></g><g class="ayo-lobe" mask="url(#ayoglovefm)"><circle cx="76" cy="42" r="26" fill="#231009"/></g></g></svg>