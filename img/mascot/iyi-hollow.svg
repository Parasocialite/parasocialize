<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 118" width="118" height="118" role="img" aria-label="iYi"><title>iYi - hollow</title><style>.iyi,.iyi-bloom,.iyi-lobe,.iyi-pupil,.iyi-lid,.iyi-blush{
transform-box:fill-box;transform-origin:center}
@keyframes iyi-breathe{0%,100%{transform:scale(1)}
50%{transform:scale(1.035)}}
@keyframes iyi-blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}}
@keyframes iyi-bloom-pulse{0%,100%{opacity:.26}50%{opacity:.42}}
.iyi{animation:iyi-breathe 5.4s ease-in-out infinite;animation-delay:var(--d,0s)}
.iyi-pupil{animation:iyi-blink 6.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.iyi-bloom{animation:iyi-bloom-pulse 5.4s ease-in-out infinite;animation-delay:var(--d,0s)}
@media (prefers-reduced-motion:reduce){
.iyi,.iyi-pupil,.iyi-bloom{animation:none}}</style><defs><radialGradient id="iyighollowh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8f5e" stop-opacity=".42"/><stop offset=".55" stop-color="#ff5a1f" stop-opacity=".14"/><stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/></radialGradient><linearGradient id="iyighollow" x1=".18" y1="0" x2=".82" y2="1"><stop offset="0" stop-color="#ffe7c4"/><stop offset=".52" stop-color="#ff8f5e"/><stop offset="1" stop-color="#f2703f"/></linearGradient><clipPath id="iyighollowcl"><circle cx="40" cy="42" r="25"/></clipPath><clipPath id="iyighollowcr"><circle cx="84" cy="42" r="25"/></clipPath><mask id="iyighollowm"><rect width="118" height="118" fill="#000"/><circle cx="40" cy="42" r="25" fill="#fff"/><circle cx="84" cy="42" r="25" fill="#fff"/></mask></defs><g class="iyi"><circle class="iyi-bloom" cx="46" cy="46" r="34" fill="url(#iyighollowh)"/><g class="iyi-lobe"><circle cx="40" cy="42" r="25" fill="url(#iyighollow)"/></g><g class="iyi-lobe"><circle cx="84" cy="42" r="25" fill="url(#iyighollow)"/></g><g class="iyi-lid"><g clip-path="url(#iyighollowcl)"><path d="M15.600000000000001 17.6A24.4 24.4 0 0 1 64.4 17.6L64.4 32.6A24.4 24.4 0 0 0 15.600000000000001 32.6Z" fill="#231009"/></g></g><g class="iyi-lid"><g clip-path="url(#iyighollowcr)"><path d="M59.6 17.6A24.4 24.4 0 0 1 108.4 17.6L108.4 36.6A24.4 24.4 0 0 0 59.6 36.6Z" fill="#231009"/></g></g><g class="iyi-pupil"><circle cx="40" cy="47" r="12" fill="#231009"/><circle cx="36.4" cy="42.92" r="1.914" fill="#fffaf2"/><path d="M43.24 48.806L43.8142 50.1458L45.154 50.72L43.8142 51.2942L43.24 52.634L42.665800000000004 51.2942L41.326 50.72L42.665800000000004 50.1458Z" fill="#fffaf2" opacity="0.506"/><circle cx="38.32" cy="53.0" r="0.5940000000000001" fill="#fffaf2" opacity="0.275"/></g><g class="iyi-pupil"><circle cx="87" cy="49" r="10" fill="#231009"/></g></g></svg>