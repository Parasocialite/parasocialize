<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 118" width="118" height="118" role="img" aria-label="Iyi"><title>Iyi - hollow</title><style>.iyi,.iyi-bloom,.iyi-lobe,.iyi-pupil,.iyi-lid,.iyi-blush{
transform-box:fill-box;transform-origin:center}
@keyframes iyi-breathe{0%,100%{transform:scale(1)}
50%{transform:scale(1.035)}}
@keyframes iyi-blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}}
@keyframes iyi-bloom-pulse{0%,100%{opacity:.26}50%{opacity:.42}}
.iyi{animation:iyi-breathe 5.4s ease-in-out infinite;animation-delay:var(--d,0s)}
.iyi-pupil{animation:iyi-blink 6.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.iyi-bloom{animation:iyi-bloom-pulse 5.4s ease-in-out infinite;animation-delay:var(--d,0s)}
@media (prefers-reduced-motion:reduce){
.iyi,.iyi-pupil,.iyi-bloom{animation:none}}</style><defs><radialGradient id="iyighollowh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6e6" stop-opacity=".85"/><stop offset="1" stop-color="#fff6e6" stop-opacity="0"/></radialGradient><linearGradient id="iyighollow" x1=".12" y1="0" x2=".88" y2="1"><stop offset="0" stop-color="#ffe7c4"/><stop offset="1" stop-color="#ff8f5e"/></linearGradient><clipPath id="iyighollowcl"><circle cx="42" cy="42" r="26"/></clipPath><clipPath id="iyighollowcr"><circle cx="76" cy="42" r="26"/></clipPath><mask id="iyighollowm"><rect width="118" height="118" fill="#000"/><circle cx="42" cy="42" r="26" fill="#fff"/><circle cx="76" cy="42" r="26" fill="#fff"/></mask></defs><g class="iyi"><circle class="iyi-bloom" cx="48" cy="46" r="35" fill="url(#iyighollowh)"/><g class="iyi-lobe"><circle cx="42" cy="42" r="26" fill="url(#iyighollow)"/></g><g class="iyi-lobe"><circle cx="76" cy="42" r="26" fill="url(#iyighollow)"/></g><g class="iyi-lid"><g clip-path="url(#iyighollowcl)"><path d="M16.6 16.6A25.4 25.4 0 0 1 67.4 16.6L67.4 33.6A25.4 25.4 0 0 0 16.6 33.6Z" fill="#231009"/></g></g><g class="iyi-lid"><g clip-path="url(#iyighollowcr)"><path d="M50.6 16.6A25.4 25.4 0 0 1 101.4 16.6L101.4 33.6A25.4 25.4 0 0 0 50.6 33.6Z" fill="#231009"/></g></g><g class="iyi-pupil"><circle cx="42" cy="48" r="8" fill="#231009"/><circle cx="39.44" cy="45.12" r="2.72" fill="#fffaf2"/><circle cx="44.56" cy="50.4" r="1.28" fill="#fffaf2" opacity=".7"/><circle cx="41.36" cy="51.52" r="0.8" fill="#fffaf2" opacity=".45"/></g><g class="iyi-pupil"><circle cx="76" cy="48" r="8" fill="#231009"/><circle cx="73.44" cy="45.12" r="2.72" fill="#fffaf2"/><circle cx="78.56" cy="50.4" r="1.28" fill="#fffaf2" opacity=".7"/><circle cx="75.36" cy="51.52" r="0.8" fill="#fffaf2" opacity=".45"/></g></g></svg>