<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 118" width="118" height="118" role="img" aria-label="iYi"><title>iYi - love</title><style>.iyi,.iyi-bloom,.iyi-lobe,.iyi-pupil,.iyi-gaze,.iyi-lid,.iyi-iris{
 transform-box:fill-box;transform-origin:center}
@keyframes iyi-look{0%,18%{transform:translate(0,0)}
 38%{transform:translate(2.4px,-.6px)}
 58%{transform:translate(2.4px,-.6px)}
 78%{transform:translate(-.9px,.4px)}
 90%,100%{transform:translate(0,0)}}
@keyframes iyi-breathe{0%,100%{transform:scale(1)}
 50%{transform:scale(1.035)}}
@keyframes iyi-blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}}
@keyframes iyi-bloom-pulse{0%,100%{opacity:.26}50%{opacity:.42}}
.iyi{animation:iyi-breathe 5s ease-in-out infinite;animation-delay:var(--d,0s)}
.iyi-pupil{animation:iyi-blink 5s ease-in-out infinite;animation-delay:var(--d,0s)}
.iyi-gaze{animation:iyi-look 15s ease-in-out infinite;animation-delay:var(--d,0s)}
.iyi-bloom{animation:iyi-bloom-pulse 5s ease-in-out infinite;animation-delay:var(--d,0s)}
@media (prefers-reduced-motion:reduce){
 .iyi,.iyi-pupil,.iyi-gaze,.iyi-bloom{animation:none}}</style><defs><clipPath id="iyiglovefcl"><circle cx="40" cy="42" r="25"/></clipPath><clipPath id="iyiglovefcr"><circle cx="84" cy="42" r="25"/></clipPath><mask id="iyiglovefm"><rect width="118" height="118" fill="#000"/><circle cx="40" cy="42" r="25" fill="#fff"/><circle cx="84" cy="42" r="25" fill="#fff"/><path d="M40 53.0C27.6 44.4 27.6 31.6 34.4 31.6C38.0 31.6 40 35.2 40 38.0C40 35.2 42.0 31.6 45.6 31.6C52.4 31.6 52.4 44.4 40 53.0Z" fill="#000"/><path d="M84 53.0C71.6 44.4 71.6 31.6 78.4 31.6C82.0 31.6 84 35.2 84 38.0C84 35.2 86.0 31.6 89.6 31.6C96.4 31.6 96.4 44.4 84 53.0Z" fill="#000"/></mask></defs><g class="iyi"><g class="iyi-lobe" mask="url(#iyiglovefm)"><circle cx="40" cy="42" r="25" fill="#231009"/></g><g class="iyi-lobe" mask="url(#iyiglovefm)"><circle cx="84" cy="42" r="25" fill="#231009"/></g></g></svg>