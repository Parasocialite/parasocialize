<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 118" width="118" height="118" role="img" aria-label="Iyi"><title>Iyi - watch</title><style>.iyi,.iyi-bloom,.iyi-lobe,.iyi-pupil,.iyi-lid,.iyi-blush{
transform-box:fill-box;transform-origin:center}
@keyframes iyi-breathe{0%,100%{transform:scale(1)}
50%{transform:scale(1.035)}}
@keyframes iyi-blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}}
@keyframes iyi-bloom-pulse{0%,100%{opacity:.26}50%{opacity:.42}}
.iyi{animation:iyi-breathe 5.4s ease-in-out infinite;animation-delay:var(--d,0s)}
.iyi-pupil{animation:iyi-blink 6.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.iyi-bloom{animation:iyi-bloom-pulse 5.4s ease-in-out infinite;animation-delay:var(--d,0s)}
@media (prefers-reduced-motion:reduce){
.iyi,.iyi-pupil,.iyi-bloom{animation:none}}</style><defs><radialGradient id="iyigwatchh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6e6" stop-opacity=".85"/><stop offset="1" stop-color="#fff6e6" stop-opacity="0"/></radialGradient><linearGradient id="iyigwatch" x1=".12" y1="0" x2=".88" y2="1"><stop offset="0" stop-color="#ffe7c4"/><stop offset="1" stop-color="#ff8f5e"/></linearGradient><clipPath id="iyigwatchcl"><circle cx="42" cy="42" r="26"/></clipPath><clipPath id="iyigwatchcr"><circle cx="76" cy="42" r="26"/></clipPath><mask id="iyigwatchm"><rect width="118" height="118" fill="#000"/><circle cx="42" cy="42" r="26" fill="#fff"/><circle cx="76" cy="42" r="26" fill="#fff"/></mask></defs><g class="iyi"><circle class="iyi-bloom" cx="48" cy="46" r="35" fill="url(#iyigwatchh)"/><g class="iyi-lobe"><circle cx="42" cy="42" r="26" fill="url(#iyigwatch)"/></g><g class="iyi-lobe"><circle cx="76" cy="42" r="26" fill="url(#iyigwatch)"/></g><g class="iyi-blush" opacity=".26"><ellipse cx="42" cy="55" rx="8" ry="4.4" fill="#e0533f"/><ellipse cx="76" cy="55" rx="8" ry="4.4" fill="#e0533f"/></g><g class="iyi-lid"><g clip-path="url(#iyigwatchcr)"><path d="M50.6 16.6A25.4 25.4 0 0 1 101.4 16.6L101.4 22.6A25.4 25.4 0 0 0 50.6 22.6Z" fill="#231009"/></g></g><g class="iyi-pupil"><circle cx="42" cy="44" r="13" fill="#231009"/><circle cx="37.84" cy="39.32" r="4.42" fill="#fffaf2"/><circle cx="46.16" cy="47.9" r="2.08" fill="#fffaf2" opacity="0.7"/><circle cx="40.96" cy="49.72" r="1.3" fill="#fffaf2" opacity="0.45"/></g><g class="iyi-pupil"><circle cx="80" cy="47" r="9" fill="#231009"/><circle cx="77.12" cy="43.76" r="0.9179999999999999" fill="#fffaf2"/><circle cx="82.88" cy="49.7" r="0.432" fill="#fffaf2" opacity="0.21"/><circle cx="79.28" cy="50.96" r="0.27" fill="#fffaf2" opacity="0.135"/></g></g></svg>