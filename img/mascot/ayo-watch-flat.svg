<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 118" width="118" height="118" role="img" aria-label="Ayo"><title>Ayo - watch</title><style>.ayo,.ayo-bloom,.ayo-lobe,.ayo-pupil,.ayo-lid,.ayo-blush{
transform-box:fill-box;transform-origin:center}
@keyframes ayo-breathe{0%,100%{transform:scale(1)}
50%{transform:scale(1.035)}}
@keyframes ayo-blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}}
@keyframes ayo-bloom-pulse{0%,100%{opacity:.26}50%{opacity:.42}}
.ayo{animation:ayo-breathe 5.4s ease-in-out infinite;animation-delay:var(--d,0s)}
.ayo-pupil{animation:ayo-blink 6.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.ayo-bloom{animation:ayo-bloom-pulse 5.4s ease-in-out infinite;animation-delay:var(--d,0s)}
@media (prefers-reduced-motion:reduce){
.ayo,.ayo-pupil,.ayo-bloom{animation:none}}</style><defs><clipPath id="ayogwatchfcl"><circle cx="42" cy="42" r="26"/></clipPath><clipPath id="ayogwatchfcr"><circle cx="76" cy="42" r="26"/></clipPath><mask id="ayogwatchfm"><rect width="118" height="118" fill="#000"/><circle cx="42" cy="42" r="26" fill="#fff"/><circle cx="76" cy="42" r="26" fill="#fff"/><circle cx="42" cy="45" r="13.5" fill="#000"/><circle cx="76" cy="45" r="13.5" fill="#000"/></mask></defs><g class="ayo"><g class="ayo-lobe" mask="url(#ayogwatchfm)"><circle cx="42" cy="42" r="26" fill="#231009"/></g><g class="ayo-lobe" mask="url(#ayogwatchfm)"><circle cx="76" cy="42" r="26" fill="#231009"/></g></g></svg>