<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 118" width="118" height="118" role="img" aria-label="Ayo"><title>Ayo - sad</title><style>.ayo,.ayo-bloom,.ayo-lobe,.ayo-pupil,.ayo-lid,.ayo-blush{
transform-box:fill-box;transform-origin:center}
@keyframes ayo-breathe{0%,100%{transform:scale(1)}
50%{transform:scale(1.035)}}
@keyframes ayo-blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}}
@keyframes ayo-bloom-pulse{0%,100%{opacity:.26}50%{opacity:.42}}
.ayo{animation:ayo-breathe 5.4s ease-in-out infinite;animation-delay:var(--d,0s)}
.ayo-pupil{animation:ayo-blink 6.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.ayo-bloom{animation:ayo-bloom-pulse 5.4s ease-in-out infinite;animation-delay:var(--d,0s)}
@media (prefers-reduced-motion:reduce){
.ayo,.ayo-pupil,.ayo-bloom{animation:none}}</style><defs><radialGradient id="ayogsadh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6e6" stop-opacity=".85"/><stop offset="1" stop-color="#fff6e6" stop-opacity="0"/></radialGradient><linearGradient id="ayogsad" x1=".12" y1="0" x2=".88" y2="1"><stop offset="0" stop-color="#ffe7c4"/><stop offset="1" stop-color="#ff8f5e"/></linearGradient><clipPath id="ayogsadcl"><circle cx="42" cy="42" r="26"/></clipPath><clipPath id="ayogsadcr"><circle cx="76" cy="42" r="26"/></clipPath><mask id="ayogsadm"><rect width="118" height="118" fill="#000"/><circle cx="42" cy="42" r="26" fill="#fff"/><circle cx="76" cy="42" r="26" fill="#fff"/></mask></defs><g class="ayo"><circle class="ayo-bloom" cx="48" cy="46" r="35" fill="url(#ayogsadh)"/><g class="ayo-lobe"><circle cx="42" cy="42" r="26" fill="url(#ayogsad)"/></g><g class="ayo-lobe"><circle cx="76" cy="42" r="26" fill="url(#ayogsad)"/></g><g class="ayo-lid"><g clip-path="url(#ayogsadcl)"><path d="M16.6 16.6A25.4 25.4 0 0 1 67.4 16.6L67.4 31.6A25.4 25.4 0 0 0 16.6 31.6Z" fill="#231009"/></g></g><g class="ayo-lid"><g clip-path="url(#ayogsadcr)"><path d="M50.6 16.6A25.4 25.4 0 0 1 101.4 16.6L101.4 31.6A25.4 25.4 0 0 0 50.6 31.6Z" fill="#231009"/></g></g><g class="ayo-pupil"><circle cx="42" cy="47" r="11" fill="#231009"/><circle cx="38.48" cy="43.04" r="3.74" fill="#fffaf2"/><circle cx="45.52" cy="50.3" r="1.76" fill="#fffaf2" opacity=".7"/><circle cx="41.12" cy="51.84" r="1.1" fill="#fffaf2" opacity=".45"/></g><g class="ayo-pupil"><circle cx="76" cy="47" r="11" fill="#231009"/><circle cx="72.48" cy="43.04" r="3.74" fill="#fffaf2"/><circle cx="79.52" cy="50.3" r="1.76" fill="#fffaf2" opacity=".7"/><circle cx="75.12" cy="51.84" r="1.1" fill="#fffaf2" opacity=".45"/></g></g></svg>