<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 118" width="118" height="118" role="img" aria-label="iYi"><title>iYi - sad</title><style>.iyi,.iyi-bloom,.iyi-lobe,.iyi-pupil,.iyi-gaze,.iyi-lid,.iyi-iris{
 transform-box:fill-box;transform-origin:center}
@keyframes iyi-look{0%,18%{transform:translate(0,0)}
 38%{transform:translate(2.4px,-.6px)}
 58%{transform:translate(2.4px,-.6px)}
 78%{transform:translate(-.9px,.4px)}
 90%,100%{transform:translate(0,0)}}
@keyframes iyi-breathe{0%,100%{transform:scale(1)}
 50%{transform:scale(1.035)}}
@keyframes iyi-blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}}
@keyframes iyi-bloom-pulse{0%,100%{opacity:.26}50%{opacity:.42}}
.iyi{animation:iyi-breathe 5s ease-in-out infinite;animation-delay:var(--d,0s)}
.iyi-pupil{animation:iyi-blink 5s ease-in-out infinite;animation-delay:var(--d,0s)}
.iyi-gaze{animation:iyi-look 15s ease-in-out infinite;animation-delay:var(--d,0s)}
.iyi-bloom{animation:iyi-bloom-pulse 5s ease-in-out infinite;animation-delay:var(--d,0s)}
@media (prefers-reduced-motion:reduce){
 .iyi,.iyi-pupil,.iyi-gaze,.iyi-bloom{animation:none}}</style><defs><radialGradient id="iyigsadh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8f5e" stop-opacity=".42"/><stop offset=".55" stop-color="#ff5a1f" stop-opacity=".14"/><stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/></radialGradient><linearGradient id="iyigsad" x1=".22" y1=".06" x2=".8" y2=".96"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#eef2f8"/><stop offset="1" stop-color="#c2cddd"/></linearGradient><radialGradient id="iyigsadi" cx=".42" cy=".36" r=".68"><stop offset="0" stop-color="#d9a441"/><stop offset="1" stop-color="#8a5a12"/></radialGradient><clipPath id="iyigsadcl"><circle cx="40" cy="42" r="25"/></clipPath><clipPath id="iyigsadcr"><circle cx="84" cy="42" r="25"/></clipPath><mask id="iyigsadm"><rect width="118" height="118" fill="#000"/><circle cx="40" cy="42" r="25" fill="#fff"/><circle cx="84" cy="42" r="25" fill="#fff"/></mask></defs><g class="iyi"><circle class="iyi-bloom" cx="46" cy="46" r="34" fill="url(#iyigsadh)"/><g class="iyi-lobe"><circle cx="40" cy="42" r="25" fill="url(#iyigsad)"/><circle cx="40" cy="42" r="23.5" fill="none" stroke="#141a24" stroke-width="3" stroke-opacity=".92"/></g><g class="iyi-lobe"><circle cx="84" cy="42" r="25" fill="url(#iyigsad)"/><circle cx="84" cy="42" r="23.5" fill="none" stroke="#141a24" stroke-width="3" stroke-opacity=".92"/></g><g class="iyi-lid"><g clip-path="url(#iyigsadcl)"><path d="M49.12 60.69A20.80 20.80 0 1 1 49.12 23.31" stroke="#231009" stroke-width="3" stroke-linecap="round" fill="none"/></g></g><g class="iyi-lid"><g clip-path="url(#iyigsadcr)"><path d="M93.12 60.69A20.80 20.80 0 1 1 93.12 23.31" stroke="#231009" stroke-width="3" stroke-linecap="round" fill="none"/></g></g><g class="iyi-lid"><g clip-path="url(#iyigsadcl)"><path d="M15.600000000000001 17.6A24.4 24.4 0 0 1 64.4 17.6L64.4 30.6A24.4 24.4 0 0 0 15.600000000000001 30.6Z" fill="#231009"/></g></g><g class="iyi-lid"><g clip-path="url(#iyigsadcr)"><path d="M59.6 17.6A24.4 24.4 0 0 1 108.4 17.6L108.4 34.6A24.4 24.4 0 0 0 59.6 34.6Z" fill="#231009"/></g></g><g class="iyi-lid"><g clip-path="url(#iyigsadcr)"><path d="M72.0 40q12.0 9 24 0" stroke="#231009" stroke-width="5.5" stroke-linecap="round" fill="none"/></g></g><circle class="iyi-iris" cx="40" cy="46" r="14.20" fill="url(#iyigsadi)" stroke="#231009" stroke-width="1.1"/><g class="iyi-gaze"><g class="iyi-pupil"><circle cx="40" cy="46" r="11.0" fill="#231009"/><circle cx="36.7" cy="42.26" r="2.7115" fill="#ffffff"/><path d="M42.97 46.698499999999996L43.78345 48.59654999999999L45.6815 49.41L43.78345 50.22345L42.97 52.1215L42.156549999999996 50.22345L40.2585 49.41L42.156549999999996 48.59654999999999Z" fill="#ffffff" opacity="0.782"/><circle cx="38.46" cy="51.5" r="0.8415" fill="#ffffff" opacity="0.425"/></g></g><circle class="iyi-iris" cx="86" cy="48" r="12.20" fill="url(#iyigsadi)" stroke="#231009" stroke-width="1.1"/><g class="iyi-gaze"><g class="iyi-pupil"><circle cx="86" cy="48" r="9.0" fill="#231009"/><circle cx="83.3" cy="44.94" r="0.7308" fill="#ffffff"/><path d="M88.43 50.0592L88.64924 50.57076L89.16080000000001 50.79L88.64924 51.00924L88.43 51.5208L88.21076000000001 51.00924L87.6992 50.79L88.21076000000001 50.57076Z" fill="#ffffff" opacity="0.258"/><circle cx="84.74" cy="52.5" r="0.2268" fill="#ffffff" opacity="0.14"/></g></g></g></svg>