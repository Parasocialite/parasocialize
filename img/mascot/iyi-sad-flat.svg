<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 118" width="118" height="118" role="img" aria-label="Iyi"><title>Iyi - sad</title><style>.iyi,.iyi-bloom,.iyi-lobe,.iyi-pupil,.iyi-lid,.iyi-blush{
transform-box:fill-box;transform-origin:center}
@keyframes iyi-breathe{0%,100%{transform:scale(1)}
50%{transform:scale(1.035)}}
@keyframes iyi-blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}}
@keyframes iyi-bloom-pulse{0%,100%{opacity:.26}50%{opacity:.42}}
.iyi{animation:iyi-breathe 5.4s ease-in-out infinite;animation-delay:var(--d,0s)}
.iyi-pupil{animation:iyi-blink 6.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.iyi-bloom{animation:iyi-bloom-pulse 5.4s ease-in-out infinite;animation-delay:var(--d,0s)}
@media (prefers-reduced-motion:reduce){
.iyi,.iyi-pupil,.iyi-bloom{animation:none}}</style><defs><clipPath id="iyigsadfcl"><circle cx="42" cy="42" r="26"/></clipPath><clipPath id="iyigsadfcr"><circle cx="76" cy="42" r="26"/></clipPath><mask id="iyigsadfm"><rect width="118" height="118" fill="#000"/><circle cx="42" cy="42" r="26" fill="#fff"/><circle cx="76" cy="42" r="26" fill="#fff"/><circle cx="42" cy="47" r="12.5" fill="#000"/><circle cx="76" cy="47" r="12.5" fill="#000"/></mask></defs><g class="iyi"><g class="iyi-lobe" mask="url(#iyigsadfm)"><circle cx="42" cy="42" r="26" fill="#231009"/></g><g class="iyi-lobe" mask="url(#iyigsadfm)"><circle cx="76" cy="42" r="26" fill="#231009"/></g></g></svg>