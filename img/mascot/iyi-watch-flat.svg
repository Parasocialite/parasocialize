<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 118" width="118" height="118" role="img" aria-label="iYi"><title>iYi - watch</title><style>.iyi,.iyi-bloom,.iyi-lobe,.iyi-pupil,.iyi-lid,.iyi-blush{
transform-box:fill-box;transform-origin:center}
@keyframes iyi-breathe{0%,100%{transform:scale(1)}
50%{transform:scale(1.035)}}
@keyframes iyi-blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}}
@keyframes iyi-bloom-pulse{0%,100%{opacity:.26}50%{opacity:.42}}
.iyi{animation:iyi-breathe 5.4s ease-in-out infinite;animation-delay:var(--d,0s)}
.iyi-pupil{animation:iyi-blink 6.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.iyi-bloom{animation:iyi-bloom-pulse 5.4s ease-in-out infinite;animation-delay:var(--d,0s)}
@media (prefers-reduced-motion:reduce){
.iyi,.iyi-pupil,.iyi-bloom{animation:none}}</style><defs><clipPath id="iyigwatchfcl"><circle cx="40" cy="42" r="25"/></clipPath><clipPath id="iyigwatchfcr"><circle cx="84" cy="42" r="25"/></clipPath><mask id="iyigwatchfm"><rect width="118" height="118" fill="#000"/><circle cx="40" cy="42" r="25" fill="#fff"/><circle cx="84" cy="42" r="25" fill="#fff"/><circle cx="40" cy="43.5" r="17.5" fill="#000"/><circle cx="87" cy="45.5" r="15.0" fill="#000"/></mask></defs><g class="iyi"><g class="iyi-lobe" mask="url(#iyigwatchfm)"><circle cx="40" cy="42" r="25" fill="#231009"/></g><g class="iyi-lobe" mask="url(#iyigwatchfm)"><circle cx="84" cy="42" r="25" fill="#231009"/></g></g></svg>